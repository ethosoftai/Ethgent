version: 1
global_disabled_tools:
- terminal_komut_calistir
agents:
- name: sosyal_medya_agent
  type: builtin
  enabled: true
  description: X, Instagram ve YouTube uzerinde yayinlama, etkilesim, bildirim tarama
    ve sosyal operasyon ajani.
  model: default
  tool_mode: custom
  system_prompt: ''
  tools:
  - bookmark_x_post
  - close_social_browser
  - close_x_browser
  - comment_instagram_post
  - context_aksiyon_kaydet
  - context_paketi_oku
  - engage_with_x_post
  - follow_instagram_account
  - follow_x_account
  - get_browser_status
  - get_x_queue
  - get_x_trends
  - inspect_instagram_post
  - inspect_instagram_profile
  - inspect_x_post
  - inspect_x_profile
  - inspect_youtube_channel
  - inspect_youtube_video
  - instagram_kullanim_rehberi
  - launch_social_browser
  - launch_x_browser
  - like_instagram_post
  - like_x_post
  - like_youtube_video
  - mark_queue_item
  - open_social_page
  - open_x_page
  - publish_x_post
  - publish_x_post_with_media
  - publish_x_thread
  - quote_x_post
  - reply_to_x_post
  - repost_x_post
  - save_x_market_snapshot
  - scan_x_notifications
  - scan_x_page
  - search_x_posts
  - search_youtube_videos
  - send_x_reply
  - snapshot_x_feed
  - submit_current_x_composer
  - subscribe_youtube_channel
  - update_queue_item
  - worker_video_yayinla
  - worker_instagram_carousel_yayinla
  - worker_yayin_durumu_sorgula
  - medya_hazirla
  - medya_dogrula
  - workspace_ekle
  - workspace_listele
  - workspace_oku
  - workspace_sonunu_oku
  - workspace_yaz
  - x_kullanim_rehberi
  - youtube_kullanim_rehberi
  - metin_ozetle
- name: content_creator_agent
  type: builtin
  enabled: true
  description: Caption, medya arama, website icerigi, HTML/CSS PNG post ve MP4 video
    uretim ajani.
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: browser_agent
  type: builtin
  enabled: false
  description: Selenium tabanli web gezinme, DOM okuma ve form etkilesimi ajani.
  model: browser_default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: asset_collector_agent
  type: builtin
  enabled: false
  description: App'in onayli medya varliklarini listeleme, yayina hazirlama/dogrulama
    ve App'ten video uretimi isteme ajani.
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: platform_data_agent
  type: builtin
  enabled: false
  description: Platformlardan (YouTube, Instagram, TikTok, X, Reddit) manifest-onayli,
    salt-okunur metrik/yorum/hesap verisi toplama ajani.
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: computer
  type: builtin
  enabled: false
  description: Bilgisyarla ilgili bi iş yapılması gerektiinde
  model: default
  tool_mode: custom
  system_prompt: ''
  tools:
  - context_paketi_oku
  - context_aksiyon_kaydet
  - sistem_durum_monitor
- name: arastirma_agent
  type: builtin
  enabled: false
  description: Derinlemesine web arastirmasi ve kapsamli rapor yazma uzmani (Gemini
    Live API).
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: sistem_agent
  type: builtin
  enabled: false
  description: Dosya yonetimi, sistem analizi ve kendini gelistirme uzmani (Gemini
    Live API).
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
- name: vlm_agent
  type: builtin
  enabled: false
  description: Ekran, klavye ve fare kontrol uzmani (Gemini Live API).
  model: default
  tool_mode: default
  system_prompt: ''
  tools: []
